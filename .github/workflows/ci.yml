name: CSSTV Code Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================================
# Common configuration
# ============================================================================

env:
  CXX_STANDARD: c++17


# ============================================================================
# Code quality
# ============================================================================

jobs:

  quality-gate:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            cppcheck

      - name: Auto-format C/C++ code
        run: |
          files=$(find include src tests \
            -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cpp' \))

          for f in $files; do
            clang-format-18 -i "$f"
          done




      # ----------------------------------------------------------------------
      # clang-format
      # ----------------------------------------------------------------------

      - name: Check C/C++ formatting
        shell: bash
        run: |
          set -e

          files=$(find include src tests \
            \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name '*.hpp' \) \
            -type f)

          if [ -z "$files" ]; then
            echo "No C/C++ source files found."
            exit 1
          fi

          clang-format \
            --dry-run \
            --Werror \
            $files

      # ----------------------------------------------------------------------
      # cppcheck
      # ----------------------------------------------------------------------

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++17 \
            --language=c++ \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            src/



  no-dynamic-allocation:
    name: No Dynamic Allocation
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Check for dynamic allocation
        shell: bash
        run: |
          set -e

          # Every *.cpp under src/ is compiled to an object file and its
          # undefined symbols are inspected. This runs per-translation-unit
          # (not on a final linked binary) so it is independent of whatever
          # a test framework, iostream, etc. might pull in on their own
          # account elsewhere in the build.
          #
          # operator delete (_Zdl.../_Zda...) is deliberately NOT flagged:
          # every polymorphic class with a virtual destructor (ModeDriver,
          # DecoderDriver) gets a compiler-generated "deleting destructor"
          # referencing operator delete as a vtable slot, regardless of
          # whether the code ever calls `delete` on one of these pointers
          # -- and this codebase never does (see the placement-construct /
          # explicit-destructor-call pattern in csstv_internal.h). Flagging
          # it would be a false positive on every build.
          #
          # operator new (_Znw.../_Zna...) IS flagged: this codebase only
          # ever uses placement new (`new (storage) T(...)`), so a plain
          # `new`/`new[]` anywhere is a real regression, not a structural
          # artifact.
          FORBIDDEN='\b(malloc|calloc|realloc|free)\b|_Znw[mj]|_Zna[mj]'

          mkdir -p build/no-alloc-check
          found_violation=0

          mapfile -t sources < <(find src -type f -name '*.cpp')

          for src_file in "${sources[@]}"; do
            obj="build/no-alloc-check/$(basename "${src_file}").o"

            g++ \
              -std=${CXX_STANDARD} \
              -Iinclude \
              -Isrc/internal \
              -Isrc/modes \
              -DCSSTV_ENABLE_ENCODER=1 \
              -DCSSTV_ENABLE_DECODER=1 \
              -DCSSTV_ENCODER_MODE_PD50=1 \
              -DCSSTV_DECODER_MODE_PD50=1 \
              -c "${src_file}" \
              -o "${obj}"

            hits=$(nm --undefined-only "${obj}" | grep -E "${FORBIDDEN}" || true)

            if [ -n "${hits}" ]; then
              echo "::error::Dynamic allocation reference found in ${src_file}:"
              echo "${hits}"
              found_violation=1
            fi
          done

          if [ "${found_violation}" -ne 0 ]; then
            echo "One or more translation units reference dynamic allocation."
            exit 1
          fi

          echo "No dynamic allocation references found in any translation unit."



  c-api-check:
    name: C API Compatibility
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Check public header with C99
        run: |
          cat > /tmp/c_api_check.c <<'EOF'
          #include "csstv.h"

          int main(void)
          {
              csstv_encoder_t encoder;
              csstv_image_t image;
              csstv_mode_info_t info;

              (void)encoder;
              (void)image;
              (void)info;

              return 0;
          }
          EOF

          gcc \
            -std=c99 \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -c /tmp/c_api_check.c \
            -o /tmp/c_api_check.o


# ============================================================================
# x86 32-bit
# ============================================================================

  compile-x86-32:
    name: Compile - x86 32-bit
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-multilib

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          g++ \
            -m32 \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# x86 64-bit
# ============================================================================

  compile-x86-64:
    name: Compile - x86 64-bit
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          g++ \
            -m64 \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# AVR
# ============================================================================

  compile-avr:
    name: Compile - AVR
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-avr \
            avr-libc

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          # Decoder is too large for AVR targets; keep encoder-only here.
          avr-g++ \
            -mmcu=atmega328p \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wshadow \
            -DCSSTV_ENABLE_DECODER=0 \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# ARM Cortex-M
# ============================================================================

  compile-arm-cortex-m:
    name: Compile - ARM Cortex-M
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          arm-none-eabi-g++ \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfloat-abi=soft \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# RISC-V (bare-metal)
# ============================================================================

  compile-riscv:
    name: Compile - RISC-V
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-unknown-elf \
            picolibc-riscv64-unknown-elf

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          # This toolchain (gcc-riscv64-unknown-elf, targeting bare-metal
          # RV32) has no libstdc++/libsupc++ at all -- only picolibc (a C
          # library). CSSTV_NO_CXX_STDLIB=1 switches the library to the
          # same freestanding fallbacks used for AVR (see
          # csstv_freestanding_runtime_support.h and the placement-new
          # declaration in pd.cpp). -specs=picolibc.specs points the
          # toolchain at picolibc's headers/libs; -fno-rtti avoids needing
          # libsupc++'s typeinfo vtables, which this codebase never uses
          # (no dynamic_cast/typeid anywhere).
          riscv64-unknown-elf-g++ \
            -march=rv32imac \
            -mabi=ilp32 \
            -specs=picolibc.specs \
            -fno-rtti \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_NO_CXX_STDLIB=1 \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# Encoder configuration checks
#
# Each mode is compiled independently.
# This verifies that build-time feature selection actually works.
# ============================================================================

  configuration-check:
    name: Configuration - ${{ matrix.configuration }}
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        configuration:
          - pd50
          - pd90
          - pd120
          - pd160
          - pd180
          - pd240
          - pd290
          - all

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Set configuration
        shell: bash
        run: |
          case "${{ matrix.configuration }}" in
            pd50)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD50" >> "$GITHUB_ENV"
              ;;

            pd90)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD90" >> "$GITHUB_ENV"
              ;;

            pd120)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD120" >> "$GITHUB_ENV"
              ;;

            pd160)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD160" >> "$GITHUB_ENV"
              ;;

            pd180)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD180" >> "$GITHUB_ENV"
              ;;

            pd240)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD240" >> "$GITHUB_ENV"
              ;;

            pd290)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD290" >> "$GITHUB_ENV"
              ;;

            all)
              echo "CSSTV_MODE=ALL" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown configuration."
              exit 1
              ;;
          esac

      - name: Compile configured source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          defines=(
            -DCSSTV_ENABLE_ENCODER=1
            -DCSSTV_ENABLE_DECODER=0
          )

          case "${CSSTV_MODE}" in
            CSSTV_ENCODER_MODE_PD50)
              defines+=(-DCSSTV_ENCODER_MODE_PD50=1)
              ;;

            CSSTV_ENCODER_MODE_PD90)
              defines+=(-DCSSTV_ENCODER_MODE_PD90=1)
              ;;

            CSSTV_ENCODER_MODE_PD120)
              defines+=(-DCSSTV_ENCODER_MODE_PD120=1)
              ;;

            CSSTV_ENCODER_MODE_PD160)
              defines+=(-DCSSTV_ENCODER_MODE_PD160=1)
              ;;

            CSSTV_ENCODER_MODE_PD180)
              defines+=(-DCSSTV_ENCODER_MODE_PD180=1)
              ;;

            CSSTV_ENCODER_MODE_PD240)
              defines+=(-DCSSTV_ENCODER_MODE_PD240=1)
              ;;

            CSSTV_ENCODER_MODE_PD290)
              defines+=(-DCSSTV_ENCODER_MODE_PD290=1)
              ;;

            ALL)
              defines+=(
                -DCSSTV_ENCODER_MODE_PD50=1
                -DCSSTV_ENCODER_MODE_PD90=1
                -DCSSTV_ENCODER_MODE_PD120=1
                -DCSSTV_ENCODER_MODE_PD160=1
                -DCSSTV_ENCODER_MODE_PD180=1
                -DCSSTV_ENCODER_MODE_PD240=1
                -DCSSTV_ENCODER_MODE_PD290=1
              )
              ;;

            *)
              echo "Invalid configuration."
              exit 1
              ;;
          esac

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            "${defines[@]}" \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# Unit tests
# ============================================================================

  unit-tests:
    name: Unit Tests
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build tests
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          mapfile -t tests < <(
            find tests -type f \( -name '*.cpp' -o -name '*.c' \)
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No test files found."
            exit 1
          fi

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -Itests \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            "${sources[@]}" \
            "${tests[@]}" \
            -o build/test_suite

      - name: Run tests
        run: |
          ./build/test_suite


# ============================================================================
# Determinism
# ============================================================================
#
# Verifies that re-encoding the same image via reset() produces
# byte-for-byte identical output to the first pass -- the property
# the cumulative-rounding logic in pd.cpp (ideal_elapsed_samples_ /
# rounded_elapsed_samples_) exists to guarantee. See
# tests/determinism_test.cpp: it drives csstv::pd::Driver directly
# with synthetic (deliberately non-round) parameters, so it needs no
# per-mode tables.
# ============================================================================

  determinism-test:
    name: Determinism
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build and run determinism test
        shell: bash
        run: |
          set -e

          mkdir -p build

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=0 \
            src/modes/pd/pd.cpp \
            src/core/tone.cpp \
            src/core/image.cpp \
            tests/determinism_test.cpp \
            -o build/determinism_test

          ./build/determinism_test


# ============================================================================
# AVR placement-new fallback correctness
# ============================================================================
#
# csstv_freestanding_runtime_support.h / the placement-new declaration
# in pd.cpp only take effect when CSSTV_NO_CXX_STDLIB is defined (auto
# for AVR, explicit elsewhere). This job forces that same code path on
# the host by passing CSSTV_NO_CXX_STDLIB=1 to a normal x86 g++ build,
# so the custom operator new / operator delete / __cxa_pure_virtual
# actually run natively, and compares their output against a normal
# build using the real <new>/libstdc++. Byte-identical output across
# both is the whole point: it proves the fallback is behaviorally
# equivalent to the standard one for this codebase's usage, without
# needing AVR hardware or an emulator.
# ============================================================================

  avr-fallback-correctness-test:
    name: AVR Fallback Correctness
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build both variants and compare
        shell: bash
        run: |
          set -e

          mkdir -p build

          FLAGS=(
            -std=${CXX_STANDARD}
            -Wall -Wextra -Werror -Wpedantic -Wconversion -Wsign-conversion -Wshadow
            -Iinclude -Isrc/internal -Isrc/modes
            -DCSSTV_ENABLE_ENCODER=1
            -DCSSTV_ENABLE_DECODER=0
          )

          COMMON_SOURCES=(
            src/modes/pd/pd.cpp
            src/core/tone.cpp
            src/core/image.cpp
            tests/avr_fallback_harness.cpp
          )

          echo "=== Building with real <new> (normal path) ==="
          g++ "${FLAGS[@]}" "${COMMON_SOURCES[@]}" -o build/harness_normal

          echo "=== Building with CSSTV_NO_CXX_STDLIB=1 (forced fallback path) ==="
          g++ "${FLAGS[@]}" -DCSSTV_NO_CXX_STDLIB=1 \
            src/internal/csstv_freestanding_runtime_support.cpp \
            "${COMMON_SOURCES[@]}" \
            -o build/harness_fallback

          ./build/harness_normal > build/out_normal.bin
          ./build/harness_fallback > build/out_fallback.bin

          if ! cmp -s build/out_normal.bin build/out_fallback.bin; then
            echo "::error::Fallback placement-new path produced different output than the real <new> path."
            cmp build/out_normal.bin build/out_fallback.bin || true
            exit 1
          fi

          echo "Fallback path output is byte-for-byte identical to the real <new> path ($(wc -c < build/out_normal.bin) bytes)."


# ============================================================================
# RAM usage
# ============================================================================
#
# Links a minimal firmware (tests/size_firmware.cpp, driving
# csstv::pd::Driver directly with synthetic parameters -- no
# pd_modes.cpp needed) for each constrained embedded target and checks
# static RAM (.data + .bss) against a budget. Budgets below are
# examples with headroom over the measured baseline; tune them to your
# actual target(s) and application budget.
# ============================================================================

  ram-usage-test:
    name: RAM Usage - ${{ matrix.target.name }}
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: avr
            budget_bytes: 1024

          - name: riscv
            budget_bytes: 4096

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        if: matrix.target.name == 'avr'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc

      - name: Install RISC-V toolchain
        if: matrix.target.name == 'riscv'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Build firmware and check RAM usage
        shell: bash
        run: |
          set -e

          mkdir -p build

          SOURCES=(
            src/modes/pd/pd.cpp
            src/core/tone.cpp
            src/core/image.cpp
            src/internal/csstv_freestanding_runtime_support.cpp
            tests/size_firmware.cpp
          )

          if [ "${{ matrix.target.name }}" = "avr" ]; then
            avr-g++ \
              -mmcu=atmega328p -std=${CXX_STANDARD} \
              -Wall -Wextra -Werror -Wpedantic -Wshadow \
              -Iinclude -Isrc/internal -Isrc/modes \
              -DCSSTV_ENABLE_ENCODER=1 -DCSSTV_ENABLE_DECODER=0 \
              "${SOURCES[@]}" -lm -o build/size_firmware.elf

            data_bytes=$(avr-size --format=sysv build/size_firmware.elf \
              | awk '/^\.data|^\.bss/ {sum += $2} END {print sum}')

          else
            riscv64-unknown-elf-g++ \
              -march=rv32imac -mabi=ilp32 -specs=picolibc.specs -fno-rtti \
              -std=${CXX_STANDARD} \
              -Wall -Wextra -Werror -Wpedantic -Wconversion -Wsign-conversion -Wshadow \
              -Iinclude -Isrc/internal -Isrc/modes \
              -DCSSTV_NO_CXX_STDLIB=1 \
              -DCSSTV_ENABLE_ENCODER=1 -DCSSTV_ENABLE_DECODER=0 \
              "${SOURCES[@]}" -nostdlib++ -o build/size_firmware.elf

            # NOTE: the Berkeley `size` "bss" column on this target's
            # default linker script also counts the reserved .stack/.heap
            # regions, not just real static data, so real static RAM is
            # computed from .data + .bss specifically via sysv output.
            data_bytes=$(riscv64-unknown-elf-size --format=sysv build/size_firmware.elf \
              | awk '/^\.data|^\.bss$/ {sum += $2} END {print sum}')
          fi

          echo "Static RAM (.data + .bss): ${data_bytes} bytes (budget: ${{ matrix.target.budget_bytes }} bytes)"

          if [ "${data_bytes}" -gt "${{ matrix.target.budget_bytes }}" ]; then
            echo "::error::RAM usage ${data_bytes} bytes exceeds budget of ${{ matrix.target.budget_bytes }} bytes."
            exit 1
          fi


# ============================================================================
# Binary size
# ============================================================================
#
# Same firmware as the RAM usage job, checking flash/code size instead.
# ============================================================================

  binary-size-test:
    name: Binary Size - ${{ matrix.target.name }}
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: avr
            budget_bytes: 16384

          - name: riscv
            budget_bytes: 65536

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        if: matrix.target.name == 'avr'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc

      - name: Install RISC-V toolchain
        if: matrix.target.name == 'riscv'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: Build firmware and check binary size
        shell: bash
        run: |
          set -e

          mkdir -p build

          SOURCES=(
            src/modes/pd/pd.cpp
            src/core/tone.cpp
            src/core/image.cpp
            src/internal/csstv_freestanding_runtime_support.cpp
            tests/size_firmware.cpp
          )

          if [ "${{ matrix.target.name }}" = "avr" ]; then
            avr-g++ \
              -mmcu=atmega328p -std=${CXX_STANDARD} \
              -Wall -Wextra -Werror -Wpedantic -Wshadow \
              -Iinclude -Isrc/internal -Isrc/modes \
              -DCSSTV_ENABLE_ENCODER=1 -DCSSTV_ENABLE_DECODER=0 \
              "${SOURCES[@]}" -lm -o build/size_firmware.elf

            code_bytes=$(avr-size --format=sysv build/size_firmware.elf \
              | awk '/^\.text|^\.data/ {sum += $2} END {print sum}')

          else
            riscv64-unknown-elf-g++ \
              -march=rv32imac -mabi=ilp32 -specs=picolibc.specs -fno-rtti \
              -std=${CXX_STANDARD} \
              -Wall -Wextra -Werror -Wpedantic -Wconversion -Wsign-conversion -Wshadow \
              -Iinclude -Isrc/internal -Isrc/modes \
              -DCSSTV_NO_CXX_STDLIB=1 \
              -DCSSTV_ENABLE_ENCODER=1 -DCSSTV_ENABLE_DECODER=0 \
              "${SOURCES[@]}" -nostdlib++ -o build/size_firmware.elf

            code_bytes=$(riscv64-unknown-elf-size --format=sysv build/size_firmware.elf \
              | awk '/^\.text|^\.init|^\.rodata/ {sum += $2} END {print sum}')
          fi

          echo "Code size (flash): ${code_bytes} bytes (budget: ${{ matrix.target.budget_bytes }} bytes)"

          if [ "${code_bytes}" -gt "${{ matrix.target.budget_bytes }}" ]; then
            echo "::error::Binary size ${code_bytes} bytes exceeds budget of ${{ matrix.target.budget_bytes }} bytes."
            exit 1
          fi


# ============================================================================
# Structure alignment
# ============================================================================
#
# csstv_internal.h already carries the load-bearing static_asserts
# (EncoderState/DecoderState fit their storage; csstv_encoder_alignment_t
# / csstv_decoder_alignment_t provide enough alignment for them -- see
# csstv.h). Those assertions already run as a side effect of every
# compile job above, but only for the flag combination that job happens
# to use. This job exists to check them explicitly, by name, across
# every supported architecture and word size in one place, so a
# regression is reported as "Structure Alignment" rather than buried
# inside an unrelated compile job's log.
# ============================================================================

  structure-alignment-test:
    name: Structure Alignment - ${{ matrix.target.name }}
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86-32
          - name: x86-64
          - name: avr
          - name: arm-cortex-m
          - name: riscv

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          case "${{ matrix.target.name }}" in
            x86-32|x86-64)
              sudo apt-get install -y g++-multilib
              ;;
            avr)
              sudo apt-get install -y gcc-avr avr-libc
              ;;
            arm-cortex-m)
              sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
              ;;
            riscv)
              sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
              ;;
          esac

      - name: Check static_asserts
        shell: bash
        run: |
          set -e

          DEFINES="-DCSSTV_ENABLE_ENCODER=1 -DCSSTV_ENABLE_DECODER=1 -Iinclude -Isrc/internal -Isrc/modes"

          case "${{ matrix.target.name }}" in
            x86-32)
              g++ -std=${CXX_STANDARD} -m32 -Wall -Wextra -Werror -Wpedantic \
                ${DEFINES} -fsyntax-only -x c++ src/internal/csstv_internal.h
              ;;

            x86-64)
              g++ -std=${CXX_STANDARD} -m64 -Wall -Wextra -Werror -Wpedantic \
                ${DEFINES} -fsyntax-only -x c++ src/internal/csstv_internal.h
              ;;

            avr)
              avr-g++ -std=${CXX_STANDARD} -mmcu=atmega328p -Wall -Wextra -Werror -Wpedantic \
                -DCSSTV_ENABLE_DECODER=0 -Iinclude -Isrc/internal -Isrc/modes \
                -fsyntax-only -x c++ src/internal/csstv_internal.h
              ;;

            arm-cortex-m)
              arm-none-eabi-g++ -std=${CXX_STANDARD} -mcpu=cortex-m4 -mthumb -mfloat-abi=soft \
                -Wall -Wextra -Werror -Wpedantic \
                ${DEFINES} -fsyntax-only -x c++ src/internal/csstv_internal.h
              ;;

            riscv)
              riscv64-unknown-elf-g++ -std=${CXX_STANDARD} -march=rv32imac -mabi=ilp32 \
                -specs=picolibc.specs -fno-rtti -Wall -Wextra -Werror -Wpedantic \
                -DCSSTV_NO_CXX_STDLIB=1 ${DEFINES} \
                -fsyntax-only -x c++ src/internal/csstv_internal.h
              ;;
          esac

          echo "Structure alignment static_asserts pass on ${{ matrix.target.name }}."


# ============================================================================
# Final status
# ============================================================================

  ci-success:
    name: CI Success

    needs:
      - quality-gate
      - no-dynamic-allocation
      - c-api-check
      - compile-x86-32
      - compile-x86-64
      - compile-avr
      - compile-arm-cortex-m
      - compile-riscv
      - configuration-check
      - unit-tests
      - determinism-test
      - avr-fallback-correctness-test
      - ram-usage-test
      - binary-size-test
      - structure-alignment-test

    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        run: |
          echo "======================================"
          echo " CSSTV CI PASSED"
          echo "======================================"
          echo "C API compatibility: OK"
          echo "C/C++ formatting:    OK"
          echo "Static analysis:     OK"
          echo "No dynamic alloc:    OK"
          echo "x86-32:              OK"
          echo "x86-64:              OK"
          echo "AVR:                 OK"
          echo "ARM Cortex-M:        OK"
          echo "RISC-V:              OK"
          echo "Configurations:      OK"
