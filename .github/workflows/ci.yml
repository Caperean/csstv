name: CSSTV Code Validation

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================================
# Common configuration
# ============================================================================

env:
  CXX_STANDARD: c++17


# ============================================================================
# Code quality
# ============================================================================

jobs:

  quality-gate:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format \
            cppcheck

      - name: Auto-format C/C++ code
        run: |
          files=$(find include src tests \
            -type f \
            \( -name '*.h' -o -name '*.hpp' -o -name '*.c' -o -name '*.cpp' \))

          for f in $files; do
            clang-format-18 -i "$f"
          done




      # ----------------------------------------------------------------------
      # clang-format
      # ----------------------------------------------------------------------

      - name: Check C/C++ formatting
        shell: bash
        run: |
          set -e

          files=$(find include src tests \
            \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name '*.hpp' \) \
            -type f)

          if [ -z "$files" ]; then
            echo "No C/C++ source files found."
            exit 1
          fi

          clang-format \
            --dry-run \
            --Werror \
            $files

      # ----------------------------------------------------------------------
      # cppcheck
      # ----------------------------------------------------------------------

      - name: Static analysis
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --std=c++17 \
            --language=c++ \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=toomanyconfigs \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            src/



  c-api-check:
    name: C API Compatibility
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install C compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Check public header with C99
        run: |
          cat > /tmp/c_api_check.c <<'EOF'
          #include "csstv.h"

          int main(void)
          {
              csstv_encoder_t encoder;
              csstv_image_t image;
              csstv_mode_info_t info;

              (void)encoder;
              (void)image;
              (void)info;

              return 0;
          }
          EOF

          gcc \
            -std=c99 \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -c /tmp/c_api_check.c \
            -o /tmp/c_api_check.o


# ============================================================================
# x86 32-bit
# ============================================================================

  compile-x86-32:
    name: Compile - x86 32-bit
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-multilib

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          g++ \
            -m32 \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# x86 64-bit
# ============================================================================

  compile-x86-64:
    name: Compile - x86 64-bit
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          g++ \
            -m64 \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# AVR
# ============================================================================

  compile-avr:
    name: Compile - AVR
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-avr \
            avr-libc

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          # Decoder is too large for AVR targets; keep encoder-only here.
          avr-g++ \
            -mmcu=atmega328p \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wshadow \
            -DCSSTV_ENABLE_DECODER=0 \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# ARM Cortex-M
# ============================================================================

  compile-arm-cortex-m:
    name: Compile - ARM Cortex-M
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          arm-none-eabi-g++ \
            -mcpu=cortex-m4 \
            -mthumb \
            -mfloat-abi=soft \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# Encoder configuration checks
#
# Each mode is compiled independently.
# This verifies that build-time feature selection actually works.
# ============================================================================

  configuration-check:
    name: Configuration - ${{ matrix.configuration }}
    needs: quality-gate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        configuration:
          - pd50
          - pd90
          - pd120
          - pd160
          - pd180
          - pd240
          - pd290
          - all

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Set configuration
        shell: bash
        run: |
          case "${{ matrix.configuration }}" in
            pd50)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD50" >> "$GITHUB_ENV"
              ;;

            pd90)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD90" >> "$GITHUB_ENV"
              ;;

            pd120)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD120" >> "$GITHUB_ENV"
              ;;

            pd160)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD160" >> "$GITHUB_ENV"
              ;;

            pd180)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD180" >> "$GITHUB_ENV"
              ;;

            pd240)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD240" >> "$GITHUB_ENV"
              ;;

            pd290)
              echo "CSSTV_MODE=CSSTV_ENCODER_MODE_PD290" >> "$GITHUB_ENV"
              ;;

            all)
              echo "CSSTV_MODE=ALL" >> "$GITHUB_ENV"
              ;;

            *)
              echo "Unknown configuration."
              exit 1
              ;;
          esac

      - name: Compile configured source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          defines=(
            -DCSSTV_ENABLE_ENCODER=1
            -DCSSTV_ENABLE_DECODER=0
          )

          case "${CSSTV_MODE}" in
            CSSTV_ENCODER_MODE_PD50)
              defines+=(-DCSSTV_ENCODER_MODE_PD50=1)
              ;;

            CSSTV_ENCODER_MODE_PD90)
              defines+=(-DCSSTV_ENCODER_MODE_PD90=1)
              ;;

            CSSTV_ENCODER_MODE_PD120)
              defines+=(-DCSSTV_ENCODER_MODE_PD120=1)
              ;;

            CSSTV_ENCODER_MODE_PD160)
              defines+=(-DCSSTV_ENCODER_MODE_PD160=1)
              ;;

            CSSTV_ENCODER_MODE_PD180)
              defines+=(-DCSSTV_ENCODER_MODE_PD180=1)
              ;;

            CSSTV_ENCODER_MODE_PD240)
              defines+=(-DCSSTV_ENCODER_MODE_PD240=1)
              ;;

            CSSTV_ENCODER_MODE_PD290)
              defines+=(-DCSSTV_ENCODER_MODE_PD290=1)
              ;;

            ALL)
              defines+=(
                -DCSSTV_ENCODER_MODE_PD50=1
                -DCSSTV_ENCODER_MODE_PD90=1
                -DCSSTV_ENCODER_MODE_PD120=1
                -DCSSTV_ENCODER_MODE_PD160=1
                -DCSSTV_ENCODER_MODE_PD180=1
                -DCSSTV_ENCODER_MODE_PD240=1
                -DCSSTV_ENCODER_MODE_PD290=1
              )
              ;;

            *)
              echo "Invalid configuration."
              exit 1
              ;;
          esac

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            "${defines[@]}" \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# Unit tests
# ============================================================================

  unit-tests:
    name: Unit Tests
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build tests
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          mapfile -t tests < <(
            find tests -type f \( -name '*.cpp' -o -name '*.c' \)
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No test files found."
            exit 1
          fi

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -Itests \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            "${sources[@]}" \
            "${tests[@]}" \
            -o build/test_suite

      - name: Run tests
        run: |
          ./build/test_suite


# ============================================================================
# Determinism test
# ============================================================================

  determinism-test:
    name: Determinism Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build determinism test
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          mapfile -t tests < <(
            find tests -type f \( -name '*.cpp' -o -name '*.c' \)
          )

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -Itests \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            "${sources[@]}" \
            "${tests[@]}" \
            -o build/test_suite

      - name: Run determinism test
        run: |
          # Run the test suite multiple times and compare outputs
          ./build/test_suite > run1.txt
          ./build/test_suite > run2.txt
          ./build/test_suite > run3.txt

          # Compare outputs
          diff run1.txt run2.txt
          diff run2.txt run3.txt

          echo "Determinism test passed: all runs produced identical output"


# ============================================================================
# RAM usage test
# ============================================================================

  ram-usage-test:
    name: RAM Usage Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ valgrind

      - name: Build RAM usage test
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          mapfile -t tests < <(
            find tests -type f \( -name '*.cpp' -o -name '*.c' \)
          )

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -g \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -Itests \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            "${sources[@]}" \
            "${tests[@]}" \
            -o build/test_suite

      - name: Measure RAM usage
        run: |
          valgrind --tool=massif --massif-out-file=massif.out ./build/test_suite
          ms_print massif.out > massif_report.txt
          cat massif_report.txt

          # Check that peak memory usage is reasonable (e.g., < 100MB)
          peak_kb=$(grep "mem_heap_B" massif_report.txt | sed 's/.*=\([0-9]*\).*/\1/' | sort -n | tail -1)
          peak_mb=$((peak_kb / 1024))
          echo "Peak memory usage: ${peak_mb} MB"

          if [ $peak_mb -gt 100 ]; then
            echo "Memory usage too high: ${peak_mb} MB"
            exit 1
          fi

          echo "RAM usage test passed"


# ============================================================================
# Binary size test
# ============================================================================

  binary-size-test:
    name: Binary Size Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build with size optimization
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          mapfile -t tests < <(
            find tests -type f \( -name '*.cpp' -o -name '*.c' \)
          )

          # Build with -Os for size optimization
          g++ \
            -std=${CXX_STANDARD} \
            -Os \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -Itests \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            "${sources[@]}" \
            "${tests[@]}" \
            -o build/test_suite_optimized

      - name: Measure binary size
        run: |
          size build/test_suite_optimized
          text_size=$(size build/test_suite_optimized | tail -1 | awk '{print $1}')
          data_size=$(size build/test_suite_optimized | tail -1 | awk '{print $2}')
          bss_size=$(size build/test_suite_optimized | tail -1 | awk '{print $3}')
          total_size=$((text_size + data_size + bss_size))

          echo "Text size: $text_size bytes"
          echo "Data size: $data_size bytes"
          echo "BSS size: $bss_size bytes"
          echo "Total size: $total_size bytes"

          # Check that total size is reasonable (e.g., < 1MB for test suite)
          if [ $total_size -gt 1048576 ]; then
            echo "Binary size too large: $total_size bytes"
            exit 1
          fi

          echo "Binary size test passed"


# ============================================================================
# Structure alignment test
# ============================================================================

  alignment-test:
    name: Structure Alignment Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build alignment test
        shell: bash
        run: |
          set -e

          mkdir -p build

          # Create a simple alignment test program
          cat > build/alignment_test.cpp <<'EOF'
          #include "csstv.h"
          #include <iostream>
          #include <cstddef>

          int main() {
              std::cout << "sizeof(csstv_encoder_t): " << sizeof(csstv_encoder_t) << std::endl;
              std::cout << "sizeof(csstv_decoder_t): " << sizeof(csstv_decoder_t) << std::endl;
              std::cout << "sizeof(csstv_encoder_alignment_t): " << sizeof(csstv_encoder_alignment_t) << std::endl;
              std::cout << "sizeof(csstv_decoder_alignment_t): " << sizeof(csstv_decoder_alignment_t) << std::endl;
              std::cout << "alignof(csstv_encoder_t): " << alignof(csstv_encoder_t) << std::endl;
              std::cout << "alignof(csstv_decoder_t): " << alignof(csstv_decoder_t) << std::endl;

              // Verify alignment is at least 16 bytes for SIMD compatibility
              if (alignof(csstv_encoder_t) < 16 || alignof(csstv_decoder_t) < 16) {
                  std::cerr << "ERROR: Alignment is less than 16 bytes" << std::endl;
                  return 1;
              }

              return 0;
          }
          EOF

          g++ \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            build/alignment_test.cpp \
            -o build/alignment_test

      - name: Run alignment test
        run: |
          ./build/alignment_test
          echo "Structure alignment test passed"


# ============================================================================
# AVR fallback correctness test
# ============================================================================

  avr-fallback-test:
    name: AVR Fallback Correctness Test
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-avr \
            avr-libc

      - name: Compile AVR fallback test
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          # Test that the freestanding C implementation compiles without libstdc++
          avr-g++ \
            -mmcu=atmega328p \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wshadow \
            -ffreestanding \
            -nostdlib \
            -DCSSTV_ENABLE_DECODER=0 \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -c "${sources[@]}"

          mv ./*.o build/

      - name: Verify AVR compilation
        run: |
          # Check that object files were created
          if [ $(ls build/*.o 2>/dev/null | wc -l) -eq 0 ]; then
            echo "ERROR: No object files created"
            exit 1
          fi

          echo "AVR fallback compilation test passed"


# ============================================================================
# RISC-V test
# ============================================================================

  compile-riscv:
    name: Compile - RISC-V
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          
          # Download and install RISC-V toolchain from SiFive
          wget https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2024.10.21/riscv64-unknown-linux-gnu-gcc-14.2.0-x86_64-linux.tar.xz
          sudo tar -xf riscv64-unknown-linux-gnu-gcc-14.2.0-x86_64-linux.tar.xz -C /opt
          
          # Add to PATH
          echo "/opt/riscv/bin" >> $GITHUB_PATH

      - name: Compile C++ source
        shell: bash
        run: |
          set -e

          mkdir -p build

          mapfile -t sources < <(
            find src -type f -name '*.cpp'
          )

          if [ "${#sources[@]}" -eq 0 ]; then
            echo "No C++ source files found."
            exit 1
          fi

          riscv64-unknown-linux-gnu-g++ \
            -march=rv64gc \
            -mabi=lp64d \
            -std=${CXX_STANDARD} \
            -Wall \
            -Wextra \
            -Werror \
            -Wpedantic \
            -Wconversion \
            -Wsign-conversion \
            -Wshadow \
            -Iinclude \
            -Isrc/internal \
            -Isrc/modes \
            -DCSSTV_ENABLE_ENCODER=1 \
            -DCSSTV_ENABLE_DECODER=1 \
            -DCSSTV_ENCODER_MODE_PD50=1 \
            -DCSSTV_ENCODER_MODE_PD90=1 \
            -DCSSTV_ENCODER_MODE_PD120=1 \
            -DCSSTV_ENCODER_MODE_PD160=1 \
            -DCSSTV_ENCODER_MODE_PD180=1 \
            -DCSSTV_ENCODER_MODE_PD240=1 \
            -DCSSTV_ENCODER_MODE_PD290=1 \
            -DCSSTV_DECODER_MODE_PD50=1 \
            -DCSSTV_DECODER_MODE_PD90=1 \
            -DCSSTV_DECODER_MODE_PD120=1 \
            -DCSSTV_DECODER_MODE_PD160=1 \
            -DCSSTV_DECODER_MODE_PD180=1 \
            -DCSSTV_DECODER_MODE_PD240=1 \
            -DCSSTV_DECODER_MODE_PD290=1 \
            -c "${sources[@]}"

          mv ./*.o build/


# ============================================================================
# Final status
# ============================================================================

  ci-success:
    name: CI Success

    needs:
      - quality-gate
      - c-api-check
      - compile-x86-32
      - compile-x86-64
      - compile-avr
      - compile-arm-cortex-m
      - compile-riscv
      - configuration-check
      - unit-tests
      - determinism-test
      - ram-usage-test
      - binary-size-test
      - alignment-test
      - avr-fallback-test

    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        run: |
          echo "======================================"
          echo " CSSTV CI PASSED"
          echo "======================================"
          echo "C API compatibility:      OK"
          echo "C/C++ formatting:         OK"
          echo "Static analysis:          OK"
